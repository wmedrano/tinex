[package]
name = "tinex"
version = "0.1.0"
edition = "2024"

[dependencies]
tinex-widgets = { path = "../tinex-widgets" }
tinex-core = { path = "../tinex-core" }
tinex-plugins = { path = "../tinex-plugins" }
anyhow = "1"
bumpalo = { version = "3.20.3", features = ["collections"] }
clap = { version = "4", features = ["derive"] }
jack = "0.13"
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
wmidi = "4.0.11"
xilem = { workspace = true }
masonry_winit = "0.4.0"

[dev-dependencies]
masonry = { version = "0.4.0", features = ["testing"] }
