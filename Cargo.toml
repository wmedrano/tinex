[workspace]
members = ["crates/tinex", "crates/tinex-core", "crates/tinex-plugins", "crates/tinex-widgets"]
resolver = "2"

[workspace.dependencies]
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.profiling]
inherits = "release"
debug = 2
strip = "none"
